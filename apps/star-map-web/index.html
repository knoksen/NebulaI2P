<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Star Map</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="nebula-canvas"></canvas>
      <div id="hud">
        <div class="title">NEBULA // STJERNEKART</div>
        <div class="hint">Move mouse / tilt device • Click stars</div>
      </div>

      <div id="nebula-hud">
        <div class="hud-corner top-left">
          <div class="hud-status">SYSTEM: <span class="status-ok">ONLINE</span></div>
          <div class="hud-coordinates">SEKTOR 7G // LOKAL KLYNGE</div>
        </div>

        <div class="hud-corner bottom-right">
          <button id="audio-toggle" class="sci-fi-btn" type="button">
            <span class="btn-icon">🔇</span>
            <span class="btn-text">ENGAGE AUDIO</span>
          </button>
        </div>
      </div>
      <div id="node-modal" class="hidden">
        <div id="node-modal-shape"></div>
        <div id="node-modal-text">Node resonance stable</div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
