[package]
name = "nebula_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nebula_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
